# Render Blueprint — deploys the backend (Python CV service + Node API).
# Two pieces deliberately live OUTSIDE this Blueprint, both to avoid Render
# costs that have free alternatives elsewhere:
#   - MongoDB runs on MongoDB Atlas's free tier, not a paid Render service
#     with a persistent disk. Set aed-backend's MONGODB_URI below.
#   - The Next.js frontend is deployed on Vercel (vercel.com), not Render —
#     see its own project there, imported from this repo with Root
#     Directory set to "frontend".
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# A few values are intentionally left for you to paste in by hand after the
# first deploy (marked "sync: false" below) — Render doesn't let a Blueprint
# string secrets together automatically, so:
#
#   1. Open aed-backend → Environment → set:
#        MONGODB_URI = mongodb+srv://<user>:<password>@<your-cluster>.mongodb.net/aed_inspection?retryWrites=true&w=majority
#          (from MongoDB Atlas: Database Access → add a user scoped to
#          readWrite on the aed_inspection database only, not admin-wide;
#          Network Access → allow 0.0.0.0/0, since Render has no static IP;
#          Clusters → Connect → Drivers → Node.js for the connection string)
#        GEMINI_API_KEY = <your Gemini key>
#        SMTP_HOST = smtp.gmail.com
#        SMTP_PORT = 587
#        SMTP_USER = <the Gmail address sending reports>
#        SMTP_PASS = <its Gmail App Password, from myaccount.google.com/apppasswords>
#      (REPORT_BCC_EMAIL already defaults to aedsmartx@gmail.com.)
#   2. Open aed-cv-service → Environment → set GEMINI_API_KEY = <same key>.
#   3. Once aed-backend has deployed, note its onrender.com URL (or attach
#      your own custom domain, e.g. api.aedsmartx.com, under its Settings).
#      On the Vercel project → Environment Variables → set
#      NEXT_PUBLIC_BACKEND_URL to that URL, then attach inspector.aedsmartx.com
#      as its custom domain in Vercel's own domain settings.
#   4. Back on aed-backend, set CORS_ORIGINS to include every origin the
#      frontend is actually served from (inspector.aedsmartx.com, the
#      Vercel *.vercel.app preview URL, etc. — comma-separated).
#
# Each manual env var change triggers an automatic redeploy of that service.

services:
  - type: pserv
    name: aed-cv-service
    runtime: docker
    plan: starter
    dockerfilePath: ./python-cv/Dockerfile
    dockerContext: ./python-cv
    envVars:
      - key: PORT
        value: "8001"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://inspector.aedsmartx.com"]'

  - type: web
    name: aed-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CV_SERVICE_URL
        value: http://aed-cv-service:8001
      - key: CV_WS_URL
        value: ws://aed-cv-service:8001
      - key: JWT_SECRET
        generateValue: true
      - key: REPORT_BCC_EMAIL
        value: aedsmartx@gmail.com
      - key: CORS_ORIGINS
        value: https://inspector.aedsmartx.com,https://aed-inspection-platform.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
