# Render Blueprint — deploys the platform (Python CV service, Node API,
# Next.js frontend) as one unit. MongoDB is NOT part of this Blueprint — it
# runs on MongoDB Atlas's free tier instead of a paid Render service with a
# persistent disk, to avoid that ongoing cost. Set aed-backend's MONGODB_URI
# to your Atlas connection string (see below).
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# A few values are intentionally left for you to paste in by hand after the
# first deploy (marked "sync: false" below) — Render doesn't let a Blueprint
# string secrets together automatically, so:
#
#   1. Open aed-backend → Environment → set:
#        MONGODB_URI = mongodb+srv://<user>:<password>@<your-cluster>.mongodb.net/aed_inspection?retryWrites=true&w=majority
#          (from MongoDB Atlas: Database Access → add a user scoped to
#          readWrite on the aed_inspection database only, not admin-wide;
#          Network Access → allow 0.0.0.0/0, since Render has no static IP;
#          Clusters → Connect → Drivers → Node.js for the connection string)
#        GEMINI_API_KEY = <your Gemini key>
#        SMTP_HOST = smtp.gmail.com
#        SMTP_PORT = 587
#        SMTP_USER = <the Gmail address sending reports>
#        SMTP_PASS = <its Gmail App Password, from myaccount.google.com/apppasswords>
#      (REPORT_BCC_EMAIL already defaults to aedsmartx@gmail.com.)
#   2. Open aed-cv-service → Environment → set GEMINI_API_KEY = <same key>.
#   3. Once aed-backend has deployed, note its onrender.com URL (or attach
#      your own custom domain, e.g. api.aedsmartx.com, under its Settings).
#      Open aed-frontend → Environment → set NEXT_PUBLIC_BACKEND_URL to that
#      URL, then attach inspector.aedsmartx.com as its custom domain.
#   4. Back on aed-backend, set CORS_ORIGINS to https://inspector.aedsmartx.com
#      (comma-separate additional origins, e.g. the temporary onrender.com
#      frontend URL, while testing before DNS cuts over).
#
# Each manual env var change triggers an automatic redeploy of that service.

services:
  - type: pserv
    name: aed-cv-service
    runtime: docker
    plan: starter
    dockerfilePath: ./python-cv/Dockerfile
    dockerContext: ./python-cv
    envVars:
      - key: PORT
        value: "8001"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://inspector.aedsmartx.com"]'

  - type: web
    name: aed-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CV_SERVICE_URL
        value: http://aed-cv-service:8001
      - key: CV_WS_URL
        value: ws://aed-cv-service:8001
      - key: JWT_SECRET
        generateValue: true
      - key: REPORT_BCC_EMAIL
        value: aedsmartx@gmail.com
      - key: CORS_ORIGINS
        value: https://inspector.aedsmartx.com
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: aed-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
