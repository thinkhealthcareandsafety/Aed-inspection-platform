<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Illustration: the front of a ZOLL AED Plus near the handle, with a white 'Replace batteries on or before' label stuck just below the round status window">
  <!-- Drawn from ZOLL's own battery-label instructions (Addendum to the AED
       Plus Administrator's Guide): the replacement-date label goes directly
       below the Status Indicator window. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F3F7"/>
      <stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE55A"/>
      <stop offset="0.55" stop-color="#C2DA3E"/>
      <stop offset="1" stop-color="#AFC72F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C5968"/>
      <stop offset="1" stop-color="#232B35"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA626"/>
      <stop offset="0.35" stop-color="#E9EDF2"/>
      <stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1B2433" flood-opacity="0.18"/>
    </filter>
    <filter id="label-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1B2433" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- the unit's front, lower edge, running off the bottom of the frame -->
  <g filter="url(#shadow)">
    <path d="M70 250 C70 190 110 150 170 150 L1030 150 C1090 150 1130 190 1130 250 L1130 900 L70 900 Z" fill="url(#body)"/>
  </g>
  <path d="M110 176 L1090 176" stroke="#E2F08F" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- carry handle opening -->
  <rect x="668" y="392" width="300" height="132" rx="66" fill="url(#slot)"/>
  <rect x="668" y="392" width="300" height="132" rx="66" fill="none" stroke="#9CB42A" stroke-width="5"/>

  <!-- Status Indicator: oval window, green tick when the last self-test passed -->
  <ellipse cx="330" cy="300" rx="92" ry="56" fill="#A9C12C"/>
  <ellipse cx="330" cy="300" rx="80" ry="46" fill="url(#glass)"/>
  <path d="M292 300 L320 326 L372 272" fill="none" stroke="#3EDC8E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M268 276 C286 262 312 258 330 258" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.25"/>

  <!-- power button -->
  <circle cx="1010" cy="300" r="50" fill="#A9C12C"/>
  <circle cx="1010" cy="300" r="40" fill="#CFC8EC"/>
  <path d="M1010 276 L1010 300" stroke="#5B4E9A" stroke-width="7" stroke-linecap="round"/>
  <path d="M992 286 A26 26 0 1 0 1028 286" fill="none" stroke="#5B4E9A" stroke-width="7" stroke-linecap="round"/>

  <!-- the battery replacement label: what this check photographs -->
  <g filter="url(#label-shadow)">
    <rect x="104" y="384" width="492" height="150" rx="18" fill="#FFFFFF"/>
    <rect x="104" y="384" width="492" height="150" rx="18" fill="none" stroke="#1E2533" stroke-width="3"/>
    <text x="350" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#1E2533">REPLACE BATTERIES ON OR BEFORE:</text>
    <!-- battery-over-hourglass symbol, as printed on the ZOLL label -->
    <rect x="134" y="450" width="30" height="16" rx="2" fill="#1E2533"/>
    <rect x="164" y="454" width="5" height="8" rx="1" fill="#1E2533"/>
    <path d="M137 474 L161 474 L149 488 Z M137 502 L161 502 L149 488 Z" fill="#1E2533"/>
    <text x="196" y="500" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="38" font-style="italic" font-weight="700" fill="#C0262D">25 / 05 / 2029</text>
    <path d="M190 510 L566 510" stroke="#1E2533" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
